<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { margin:0; background:#222; font-family: monospace; display:flex; gap:40px; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
  .screen { position:relative; border:8px solid #444; border-radius:20px; background:#0B1020; overflow:hidden; box-shadow:0 20px 50px rgba(0,0,0,0.5); }
  .landscape { width:800px; height:450px; }
  .portrait { width:360px; height:640px; }
  .bg-gradient { position:absolute; width:100%; height:100%; background: linear-gradient(160deg, #0B1020 0%, #1E2A4A 100%); }
  .clock { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); color:#fff; font-size:64px; font-weight:bold; }
  .overlay { position:absolute; bottom:20px; width:100%; display:flex; justify-content:space-between; padding:0 20px; box-sizing:border-box; pointer-events:none; }
  .speed-tag { color:#38BDF8; font-size:18px; font-weight:bold; background:rgba(0,0,0,0.3); padding:4px 12px; border-radius:10px; border:1px solid rgba(56,189,248,0.3); }
  .label { font-size:12px; color:#94a3b8; display:block; text-align:center; }
</style>
</head>
<body>
  <!-- 横屏车机模式 -->
  <div class="screen landscape">
    <div class="bg-gradient"></div>
    <div class="clock">12:00</div>
    <div class="overlay">
      <div class="speed-tag"><span>↓</span> 12.45 <small>Mbps</small></div>
      <div class="speed-tag"><span>↑</span> 2.10 <small>Mbps</small></div>
    </div>
  </div>
  <!-- 竖屏手机模式 -->
  <div class="screen portrait">
    <div class="bg-gradient"></div>
    <div class="clock" style="font-size:40px">12:00</div>
    <div class="overlay">
      <div class="speed-tag"><span>↓</span> 12.45 <small>Mbps</small></div>
      <div class="speed-tag"><span>↑</span> 2.10 <small>Mbps</small></div>
    </div>
  </div>
</body>
</html>
