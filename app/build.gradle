// C桌面 应用模块
// 关键取舍：
//  - 不用 AndroidX / AppCompat，直接继承 android.app.Activity，APK 小、启动快
//  - minSdk 16 覆盖 Android 4.1 的老车机与盒子（ExoPlayer 2.x 的地板）
//  - 关闭依赖混淆压缩以外的花活，先保证能装能跑
apply plugin: 'com.android.application'

android {
    namespace 'com.c.launcher'
    compileSdk 34

    // 固定调试签名：CI 注入 keystore 路径与口令，保证每次发版签名一致，
    // 用户升级不用卸载重装。本地没有这些参数时退回默认 debug 签名。
    if (project.hasProperty('ksFile')) {
        signingConfigs {
            cdesk {
                storeFile file(project.property('ksFile'))
                storePassword project.property('ksPass')
                keyAlias project.property('keyAlias')
                keyPassword project.property('keyPass')
            }
        }
    }

    defaultConfig {
        applicationId project.hasProperty('appId') ? project.property('appId') : "com.c.launcher"
        minSdk 16
        targetSdk 34
        versionCode 20
        versionName "0.7.5"
        // 版本号只写这一处：桌面角标、设置页、更新检查的「当前版本」全读它。
        // 手抄进 strings.xml 会漂——四语曾一起停在 0.4.1，导致更新检查
        // 提示用户升级到已经装着的版本。
        resValue "string", "app_version", versionName
        // 只要中文和英文，砍掉其它语言能省几百 KB
        resConfigs "zh", "zh-rTW", "zh-rHK", "en"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 预览版先用 debug 签名，方便直接装车机
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            if (project.hasProperty('ksFile')) {
                signingConfig signingConfigs.cdesk
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        // 首轮只枚举 NewApi，读完整报告修完后再把 abortOnError 打开做门禁
        abortOnError false
        checkReleaseBuilds false
        checkOnly 'NewApi', 'UnspecifiedImmutableFlag'
    }

    testOptions {
        unitTests {
            // Robolectric 需要 inflate 真实布局、访问 R，才能抓到 ClassCastException 这类崩溃
            includeAndroidResources = true
            all {
                maxHeapSize '2g'
            }
        }
    }
}

dependencies {
    // 仅用于局域网传输二维码（QRCodeWriter），纯 Java 无 native；R8 裁剪后增量很小
    implementation 'com.google.zxing:core:3.5.3'

    // ExoPlayer 2.18.1 是最后一版支持 minSdk 16 的（media3 起要求 API 21，老车机用不了）。
    // 只取 core + hls：不引 exoplayer-ui，避免把 androidx.media / recyclerview 一起拖进来。
    implementation 'com.google.android.exoplayer:exoplayer-core:2.18.1'
    implementation 'com.google.android.exoplayer:exoplayer-hls:2.18.1'
    // 官方控制条（PlayerView）：播放/暂停、进度条、快退快进、缓冲圈都是现成的，
    // 比自己手搓的好看也稳。会带入 androidx.media + recyclerview，可接受。
    implementation 'com.google.android.exoplayer:exoplayer-ui:2.18.1'

    // 仅测试期依赖，不进 APK
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}

// 测试失败时把断言内容打到 CI 日志里。
// 默认只报「某某测试 FAILED + 行号」，看不到到底哪个控件、哪段文字出问题，
// 排查只能靠猜。
tasks.withType(Test).configureEach {
    testLogging {
        events "failed"
        exceptionFormat "full"
        showStackTraces true
        showExceptions true
        showCauses true
    }
}
