name: Bootstrap keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate fixed debug keystore
        run: |
          keytool -genkeypair -v -keystore cdesk-debug.keystore -alias cdesk \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass cdesk2026 -keypass cdesk2026 \
            -dname "CN=CDesk Debug, OU=CDesk, O=CDesk, L=CN, ST=CN, C=CN"
      - uses: actions/upload-artifact@v4
        with:
          name: cdesk-debug-keystore
          path: cdesk-debug.keystore