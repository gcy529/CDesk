name: Make keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate fixed debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -alias cdesk \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -storepass cdesk2026 -keypass cdesk2026 \
            -dname "CN=CDesk, OU=CDesk, O=CDesk, L=CN, ST=CN, C=CN"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: debug.keystore
