name: Security Scan

# 两条独立的安全扫描路径：
#   1. build-and-sast（主路径，必须通过）：Gradle release 构建出 APK，
#      用 narvy-cli 做 SAST 扫描产出 SARIF，上传为构建产物。
#   2. mobsf-optional（备份路径，允许失败）：用 MobSF 官方 mobsfscan
#      对源码做静态分析，产出 SARIF，作为 narvy-cli 的补充报告。
#
# 为什么 MobSF 是可选路径：mobsfscan 基于 semgrep + libsast，扫描
# 源码级别的安全问题；作为补充路径，continue-on-error 不阻塞主流程。

on:
  push:
    branches: [ beta ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  build-and-sast:
    name: Build & SAST (narvy-cli)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Build release APK
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease --stacktrace

      - name: Install narvy-cli
        run: |
          python3 -m venv /tmp/narvy-venv
          /tmp/narvy-venv/bin/pip install narvy-cli
          echo "/tmp/narvy-venv/bin" >> $GITHUB_PATH
          export PATH="/tmp/narvy-venv/bin:$PATH"
          narvy-cli --version

      - name: Run SAST scan
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Scanning: $APK"
          narvy-cli scan "$APK" --output sarif --file narvy-results.sarif
          echo "SARIF size: $(wc -c < narvy-results.sarif) bytes"

      - name: Upload SARIF report
        uses: actions/upload-artifact@v4
        with:
          name: narvy-sast-sarif
          path: narvy-results.sarif

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-apk
          path: app/build/outputs/apk/release/*.apk

  mobsf-optional:
    name: MobSF (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Run mobsfscan (source SAST)
        uses: MobSF/mobsfscan@main
        with:
          args: 'app/src/main --sarif --output mobsfscan-results.sarif || true'

      - name: Upload MobSF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobsf-report
          path: mobsfscan-results.sarif
          if-no-files-found: ignore
