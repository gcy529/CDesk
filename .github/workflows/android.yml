name: Build APK

# 没有本地 Android 环境也能出包：推到 GitHub 让云端编译
# 也支持手动指定包名 —— 有些车机固件按包名做白名单，
# 想换包名不用改代码，直接在这里填即可
on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      appid:
        description: 'applicationId（留空用默认 com.c.launcher）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed || true

      - name: Resolve applicationId
        id: appid
        run: |
          ID="${{ inputs.appid }}"
          if [ -z "$ID" ]; then ID="com.c.launcher"; fi
          echo "value=$ID" >> $GITHUB_OUTPUT
          echo "building with applicationId = $ID"

      - name: Restore fixed debug keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > $HOME/.cdesk-debug.keystore
            echo "KS=$HOME/.cdesk-debug.keystore" >> $GITHUB_ENV
            echo "fixed keystore restored from secret"
          elif [ -f debug.keystore ]; then
            cp debug.keystore $HOME/.cdesk-debug.keystore
            echo "KS=$HOME/.cdesk-debug.keystore" >> $GITHUB_ENV
            echo "fixed keystore restored from repo file"
          else
            echo "::warning::没有 secret 也没有仓库 keystore，回退随机调试签名（升级需卸载重装）"
          fi

      - name: Build debug APK
        env:
          KS: ${{ env.KS }}
        run: |
          chmod +x gradlew || true
          # 不再用裸 gradle 生成 wrapper：runner 预装 Gradle 版本漂移（Ubuntu 26 镜像 Gradle 9）
          # 会在评估期撞 DependencyHandler.module() 移除错误。仓库自带 gradle-wrapper.jar，直接用。
          if [ -n "$KS" ]; then
            ./gradlew assembleDebug -PappId=${{ steps.appid.outputs.value }} \
              -PksFile=$KS -PksPass=cdesk2026 -PkeyAlias=cdesk -PkeyPass=cdesk2026 --stacktrace
          else
            ./gradlew assembleDebug -PappId=${{ steps.appid.outputs.value }} --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appid.outputs.value }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Compute SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        id: sha
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          SUM=$(sha256sum "$APK" | awk '{print $1}')
          echo "apk=$(basename "$APK")" >> $GITHUB_OUTPUT
          echo "sum=$SUM" >> $GITHUB_OUTPUT
          echo "SHA-256: $SUM"

      - name: Write release body
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > release_body.md <<'EOF'
          ## 下载（三选一，速度不同）
          - 官网（国内直连）：https://gcy5.cn.mt
          - GitHub 直链（海外快）：见下方 Assets
          - GHFast 加速（国内推荐）：https://ghfast.top/https://github.com/gcy529/CDesk/releases/download/TAGNAME/APKNAME
          - GH-Proxy 加速（备用）：https://gh-proxy.com/https://github.com/gcy529/CDesk/releases/download/TAGNAME/APKNAME

          SHA-256: SHASUM

          反馈/找回：公众号「韭菜超先生」 · QQ 群 970805386
          EOF
          sed -i "s/TAGNAME/${{ github.ref_name }}/g; s/APKNAME/${{ steps.sha.outputs.apk }}/g; s/SHASUM/${{ steps.sha.outputs.sum }}/g" release_body.md
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{ if (++c==2) exit } c>=1' CHANGELOG.md > changelog_head.md
            printf '\n\n---\n\n' >> changelog_head.md
            cat release_body.md >> changelog_head.md
            mv changelog_head.md release_body.md
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          body_path: release_body.md
          draft: false
          prerelease: false
      - name: Write beta body
        if: github.ref == 'refs/heads/beta'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle || echo '?')
          {
            echo '## 尝鲜版 Beta'
            echo ''
            echo '开发分支自动构建，**可能不稳定**。功能在 beta 上验证通过后，才合并进 main 成为正式版。'
            echo ''
            echo '| 版本 | 提交 |'
            echo '| --- | --- |'
            echo "| $VER | ${GITHUB_SHA:0:7} |"
            echo ''
            if [ -f CHANGELOG.md ]; then
              awk '/^## /{ if (++c==2) exit } c>=1' CHANGELOG.md
            fi
            echo ''
            echo '### 下载'
            echo ''
            echo "- 带版本号：https://github.com/gcy529/CDesk/releases/download/beta/CDesk-${VER}-beta.apk（推荐，看得出是哪版）"
            echo "- 固定直链：https://github.com/gcy529/CDesk/releases/download/beta/app-debug.apk（永远指向最新）"
            echo ''
            echo '### 安装说明'
            echo ''
            echo '与正式版同一签名，可直接覆盖安装；想回正式版就下 Releases 里的最新正式版。'
            echo ''
            echo '---'
            echo '[稳定版](https://github.com/gcy529/CDesk/releases/latest) · [官网](https://gcy5.cn.mt) · [全部更新日志](https://github.com/gcy529/CDesk/blob/main/CHANGELOG.md)'
          } > release_body_beta.md
      - name: Copy versioned APK (beta)
        if: github.ref == 'refs/heads/beta'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle || echo unknown)
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/CDesk-${VER}-beta.apk"

      - name: Clean previous beta asset
        if: github.ref == 'refs/heads/beta'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta --json assets -q '.assets[].name' 2>/dev/null | while read -r n; do
            gh release delete-asset beta "$n" -y || true
          done
      - name: Write version.json (update checker)
        run: |
          if [ -z "$VER" ]; then echo "VER empty, skip"; exit 0; fi
          cat > version.json <<EOF
          {"version":"$VER","url":"https://github.com/gcy529/CDesk/releases/download/beta/CDesk-$VER-beta.apk","channel":"beta"}
          EOF
          cat version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          if git diff --cached --quiet; then echo "version.json unchanged"; exit 0; fi
          git commit -m "chore: version.json -> $VER [skip ci]"
          git push origin HEAD:beta || true

      - name: Release beta
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta 测试版（滚动更新）
          body_path: release_body_beta.md
          prerelease: true
          make_latest: 'false'
          files: |
            app/build/outputs/apk/debug/CDesk-*-beta.apk
            app/build/outputs/apk/debug/app-debug.apk
      - name: Cleanup old runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in $(gh api repos/$GITHUB_REPOSITORY/actions/workflows -q '.workflows[].id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" -q '.workflow_runs[10:].[].id' | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            done
          done

      - name: Report size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Sync download links on site
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i -E "s#/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/app-debug\.apk#/releases/download/${TAG}/app-debug.apk#g" index.html README.md
          if git diff --quiet; then echo "links already up to date"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html README.md
          git commit -m "chore: 下载链接同步 ${TAG} [skip ci]"
          git push origin HEAD:refs/heads/main || true
