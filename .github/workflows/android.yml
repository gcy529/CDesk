name: Build APK

# 没有本地 Android 环境也能出包：推到 GitHub 让云端编译
# 也支持手动指定包名 —— 有些车机固件按包名做白名单，
# 想换包名不用改代码，直接在这里填即可
on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      appid:
        description: 'applicationId（留空用默认 com.c.launcher）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          sdkmanager --list_installed || true

      - name: Resolve applicationId
        id: appid
        run: |
          ID="${{ inputs.appid }}"
          if [ -z "$ID" ]; then ID="com.c.launcher"; fi
          echo "value=$ID" >> $GITHUB_OUTPUT
          echo "building with applicationId = $ID"

      - name: Verify version consistency
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)
          JVER=$(grep -oP '"version"\s*:\s*"\K[^"]+' version.json)
          echo "gradle=$VER version.json=$JVER"
          grep -q "^## $VER" CHANGELOG.md || { echo "::error::CHANGELOG.md 缺少 ## $VER"; exit 1; }

          # version.json 是「已发布版本」的声明，不是「本次构建版本」的副本：
          # 官网改文案、改 UI 不该逼着升版本号，所以这里只校验它合法、
          # 且不低于 build.gradle（发版时两者相等，构建期可以不相等）。
          echo "$JVER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::version.json($JVER) 版本号格式非法"; exit 1; }
          LOW=$(printf '%s\n%s\n' "$JVER" "$VER" | sort -V | head -n 1)
          [ "$LOW" = "$VER" ] || { echo "::error::version.json($JVER) 低于 build.gradle($VER)，会让线上用户收不到更新"; exit 1; }

          # 官网已迁到 site 分支，这里不再校验 index.html 的版本号
          if [ -f index.html ]; then
            echo "::warning::main 分支仍有 index.html，官网应在 site 分支维护"
          fi
          # 官网/版本文件里不允许残留其它版本的直链（classic 页曾长期停留在旧号，这条就是为它加的）
          BAD=$(grep -oP 'releases/download/v\K[0-9]+\.[0-9]+\.[0-9]+' index.html version.json README.md 2>/dev/null | cut -d: -f2 | sort -u | grep -vx "$VER" || true)
          if [ -n "$BAD" ]; then
            echo "::error::以下版本的下载直链仍残留在官网/README：$(echo $BAD | tr '\n' ' ')（当前 $VER）"
            exit 1
          fi
          if [ -d classic ]; then
            echo "::error::classic/ 页面已下线，请删除该目录"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            [ "${GITHUB_REF_NAME}" = "v$VER" ] || { echo "::error::tag(${GITHUB_REF_NAME}) 与 versionName(v$VER) 不一致"; exit 1; }
          fi

      - name: Restore signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.CDESK_KS_PASS }}
          KEY_PASS: ${{ secrets.CDESK_KEY_PASS }}
        run: |
          # 口令只存在于 Secrets。缺任何一项就直接失败：
          # 回退随机调试签名会让每个包证书都不同，用户永远无法覆盖升级。
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::缺少签名 Secrets（DEBUG_KEYSTORE_B64 / CDESK_KS_PASS / CDESK_KEY_PASS）"
            echo "::error::拒绝回退随机签名，本次构建中止"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$HOME/.cdesk-release.p12"
          echo "KS=$HOME/.cdesk-release.p12" >> "$GITHUB_ENV"
          echo "keystore restored ($(stat -c%s "$HOME/.cdesk-release.p12") bytes)"

      - name: Build debug APK
        env:
          KS: ${{ env.KS }}
          CDESK_KS_PASS: ${{ secrets.CDESK_KS_PASS }}
          CDESK_KEY_PASS: ${{ secrets.CDESK_KEY_PASS }}
        run: |
          chmod +x gradlew || true
          # 不再用裸 gradle 生成 wrapper：runner 预装 Gradle 版本漂移（Ubuntu 26 镜像 Gradle 9）
          # 会在评估期撞 DependencyHandler.module() 移除错误。仓库自带 gradle-wrapper.jar，直接用。
          ./gradlew assembleDebug -PappId=${{ steps.appid.outputs.value }} \
            -PksFile="$KS" -PksPass="$CDESK_KS_PASS" -PkeyAlias=cdesk -PkeyPass="$CDESK_KEY_PASS" --stacktrace

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          APKSIGNER=$(command -v apksigner || ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
          GOT=$(grep -m1 'SHA-256 digest' certs.txt | awk '{print $NF}')
          EXPECT="c3d95bd9ab940abc812ed7458664581e656c910e891cf5cc64e39f851d307044"
          if [ "$GOT" != "$EXPECT" ]; then
            echo "::error::APK 证书指纹不符：$GOT != $EXPECT（签名配置被改坏或密钥不对）"
            exit 1
          fi
          echo "signature ok: $GOT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.appid.outputs.value }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Compute SHA-256
        if: startsWith(github.ref, 'refs/tags/v')
        id: sha
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          SUM=$(sha256sum "$APK" | awk '{print $1}')
          echo "apk=$(basename "$APK")" >> $GITHUB_OUTPUT
          echo "sum=$SUM" >> $GITHUB_OUTPUT
          echo "SHA-256: $SUM"

      - name: Write release body
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cat > release_body.md <<'EOF'
          ## 下载（三选一，速度不同）
          - 官网（国内直连）：https://gcy5.cn.mt
          - GitHub 直链（海外快）：见下方 Assets
          - GHFast 加速（国内推荐）：https://ghfast.top/https://github.com/gcy529/CDesk/releases/download/TAGNAME/APKNAME
          - GH-Proxy 加速（备用）：https://gh-proxy.com/https://github.com/gcy529/CDesk/releases/download/TAGNAME/APKNAME

          SHA-256: SHASUM

          反馈/找回：公众号「韭菜超先生」 · QQ 群 970805386
          EOF
          sed -i "s/TAGNAME/${{ github.ref_name }}/g; s/APKNAME/${{ steps.sha.outputs.apk }}/g; s/SHASUM/${{ steps.sha.outputs.sum }}/g" release_body.md
          if [ -f CHANGELOG.md ]; then
            awk '/^## /{ if (++c==2) exit } c>=1' CHANGELOG.md > changelog_head.md
            printf '\n\n---\n\n' >> changelog_head.md
            cat release_body.md >> changelog_head.md
            mv changelog_head.md release_body.md
          fi

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          body_path: release_body.md
          draft: false
          prerelease: false
      - name: Write beta body
        if: github.ref == 'refs/heads/beta'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle || echo '?')
          {
            echo "## CDesk b${VER}（测试版）"
            echo ''
            if [ -f CHANGELOG.md ]; then
              awk '/^## /{ if (++c==2) exit } c>=1' CHANGELOG.md
              echo ''
            fi
            echo '### 下载'
            echo ''
            echo "https://github.com/gcy529/CDesk/releases/download/beta/CDesk-${VER}-beta.apk"
            echo ''
            echo '国内下不动就用这两条（同一个包）：'
            echo ''
            echo "https://ghfast.top/https://github.com/gcy529/CDesk/releases/download/beta/CDesk-${VER}-beta.apk"
            echo ''
            echo "https://gh-proxy.com/https://github.com/gcy529/CDesk/releases/download/beta/CDesk-${VER}-beta.apk"
          } > release_body_beta.md
      - name: Copy versioned APK (beta)
        if: github.ref == 'refs/heads/beta'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle || echo unknown)
          cp app/build/outputs/apk/debug/*.apk "app/build/outputs/apk/debug/CDesk-${VER}-beta.apk"

      - name: Clean previous beta asset
        if: github.ref == 'refs/heads/beta'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view beta --json assets -q '.assets[].name' 2>/dev/null | while read -r n; do
            gh release delete-asset beta "$n" -y || true
          done
      - name: Write version.json (update checker)
        if: github.ref == 'refs/heads/beta'
        run: |
          VER=$(grep -oP 'versionName "\K[^"]+' app/build.gradle || echo '')
          if [ -z "$VER" ]; then echo "VER empty, skip"; exit 0; fi
          APK="app/build/outputs/apk/debug/CDesk-${VER}-beta.apk"
          SUM=$(sha256sum "$APK" | awk '{print $1}')
          cat > version.json <<EOF
          {"version":"$VER","url":"https://github.com/gcy529/CDesk/releases/download/beta/CDesk-$VER-beta.apk","sha256":"$SUM","channel":"beta","force":false}
          EOF
          cat version.json
          # 不再由 CI 提交 version.json 回 beta：那会把发版提交顶掉，线上版本号永远落后
          echo 'version.json 由发版提交维护，CI 不提交'

      - name: Release beta
        if: github.ref == 'refs/heads/beta'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beta
          name: Beta 测试版（滚动更新）
          body_path: release_body_beta.md
          prerelease: true
          make_latest: 'false'
          # 只放带版本号的一个包：多一个 app-debug.apk 会让人搞不清该下哪个
          files: |
            app/build/outputs/apk/debug/CDesk-*-beta.apk
      - name: Cleanup old runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for wf in $(gh api repos/$GITHUB_REPOSITORY/actions/workflows -q '.workflows[].id'); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?per_page=100" -q '.workflow_runs[10:].[].id' | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$id" || true
            done
          done

      - name: Report size
        run: ls -lh app/build/outputs/apk/debug/*.apk

      - name: Sync download links in index.html (retired)
        if: false
        continue-on-error: true
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i -E "s#/releases/download/v[0-9]+\.[0-9]+\.[0-9]+/app-debug\.apk#/releases/download/${TAG}/app-debug.apk#g" index.html README.md
          if git diff --quiet; then echo "links already up to date"; exit 0; fi
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add index.html README.md
          git commit -m "chore: 下载链接同步 ${TAG} [skip ci]"
          git push origin HEAD:refs/heads/main || true
